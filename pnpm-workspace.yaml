allowBuilds:
  '@posthog/cli': true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  msw: false
  protobufjs: true
  unrs-resolver: true
overrides:
  # drizzle-kit -> @esbuild-kit pins esbuild 0.18.x, which has the
  # dev-server CORS vulnerability fixed in 0.25.0
  esbuild@<=0.24.2: '>=0.25.0'
  # kysely 0.29 removed DEFAULT_MIGRATION_(LOCK_)TABLE exports that
  # @better-auth/kysely-adapter still imports, breaking the SSR build
  kysely: ^0.28.17
